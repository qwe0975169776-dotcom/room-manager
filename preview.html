<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Alex 的房間收納</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one room — search on top, cabinets as labeled boxes; tap a box to open it. Labels look like label-maker tape. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#1c2530; --muted:#5d6a79; --line:#d3d9e0;
  --accent:#16695f; --accent-ink:#ffffff; --warn:#b4540a; --warn-bg:#fdf0e3; --bad:#b42318; --bad-bg:#fdecea;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.06);
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a2129; --surface-2:#151b22; --ink:#e5eaf0; --muted:#94a1b0; --line:#2b3540;
  --accent:#4cc2b2; --accent-ink:#0d1a18; --warn:#f0a05a; --warn-bg:#33240f; --bad:#ff8a7d; --bad-bg:#3a1915;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --surface-2:#151b22; --ink:#e5eaf0; --muted:#94a1b0; --line:#2b3540;
  --accent:#4cc2b2; --accent-ink:#0d1a18; --warn:#f0a05a; --warn-bg:#33240f; --bad:#ff8a7d; --bad-bg:#3a1915;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
:root{--pattern:none;--pattern-size:auto;--radius:12px}

/* 主題範本：每個主題固定一種配色（不跟深色模式切換） */
:root[data-skin="candy"]{--bg:#fff3f8;--surface:#ffffff;--surface-2:#fff0f6;--ink:#4a2340;--muted:#9a6a8a;--line:#f6cfe0;
  --accent:#ff4f9a;--accent-ink:#fff;--warn:#c2650a;--warn-bg:#fff1dc;--bad:#d6304a;--bad-bg:#ffe3e8;
  --pattern:radial-gradient(circle,#ffd3e6 2.2px,transparent 2.8px),radial-gradient(circle,#c9f0e4 2.2px,transparent 2.8px);
  --pattern-size:28px 28px;--radius:22px;--shadow:0 4px 0 #f6cfe0;color-scheme:light}
:root[data-skin="forest"]{--bg:#f1f7e4;--surface:#fffdf2;--surface-2:#f6f9ea;--ink:#24361f;--muted:#5f7550;--line:#d4e2b8;
  --accent:#3b9a2c;--accent-ink:#fff;--warn:#b25d07;--warn-bg:#fdf0d8;--bad:#c0392b;--bad-bg:#fbe5e1;
  --pattern:repeating-linear-gradient(45deg,rgba(110,170,50,.08) 0 14px,transparent 14px 28px);
  --radius:18px;--shadow:0 3px 0 #d4e2b8;color-scheme:light}
:root[data-skin="ocean"]{--bg:#d9f3fa;--surface:#ffffff;--surface-2:#eefafd;--ink:#0b3a4f;--muted:#4c7a8c;--line:#bde3ee;
  --accent:#0a9fc0;--accent-ink:#fff;--warn:#b5600c;--warn-bg:#fff0dc;--bad:#c93a3a;--bad-bg:#fde6e6;
  --pattern:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95) 3px,rgba(255,255,255,.35) 5px,transparent 6px),radial-gradient(circle at 70% 75%,rgba(255,255,255,.8) 2px,transparent 3.5px),linear-gradient(180deg,#e6f8fc,#bfe8f3);
  --pattern-size:70px 70px,40px 40px,100% 100%;--radius:20px;--shadow:0 6px 18px rgba(10,110,140,.12);color-scheme:light}
:root[data-skin="space"]{--bg:#15153a;--surface:#23234f;--surface-2:#1c1c44;--ink:#f3f1ff;--muted:#aeacdc;--line:#3a3a74;
  --accent:#ffcd3c;--accent-ink:#1b1733;--warn:#ffb25e;--warn-bg:#3c2b16;--bad:#ff7d8c;--bad-bg:#40193a;
  --pattern:radial-gradient(1.6px 1.6px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#d6d8ff,transparent),radial-gradient(1.8px 1.8px at 150px 20px,#ffe9a8,transparent),radial-gradient(1px 1px at 60px 110px,#fff,transparent);
  --pattern-size:180px 130px;--radius:16px;--shadow:0 0 0 1px #3a3a74,0 8px 24px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--pattern);background-size:var(--pattern-size);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;min-height:100%}
.skins{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.skins button{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px 4px 4px;font-size:14px}
.skins button[aria-pressed="true"]{border-color:var(--accent);font-weight:700}
.skins .sw{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
h1 .hl{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 28%,transparent) 62%);padding:0 4px}
.cab .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cab .ico{font-size:36px;line-height:1}
.cab{border-radius:var(--radius)!important;background:color-mix(in srgb,var(--tint,transparent) 13%,var(--surface))!important;border-color:color-mix(in srgb,var(--tint,var(--line)) 40%,var(--line))!important}
.cab.add{background:transparent!important}
.cab:hover{transform:translateY(-3px) rotate(-.6deg)!important}
.item,.search,.notice,.empty{border-radius:calc(var(--radius) - 4px)!important}
.btn{border-radius:99px!important}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:13px;color:var(--muted)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:#2fa36b}.sync.busy .dot{background:var(--accent);animation:pulse 1s infinite}
.sync.off .dot{background:var(--warn)}.sync.err .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.room-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gear{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:13px;color:var(--ink)}
.set-sec{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.set-sec h3{margin:0;font-size:15px;font-family:var(--f-display);font-weight:400}
.set-sec p{margin:0;font-size:13px;color:var(--muted)}
.set-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.log{display:flex;flex-direction:column;gap:10px;font-size:14px}
.log b{font-family:var(--f-mono);font-size:13px}
.log ul{margin:2px 0 0;padding-left:20px;color:var(--muted)}
.ver{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.icons{display:flex;gap:6px;flex-wrap:wrap}
.icons button{font-size:24px;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2)}
.icons button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--surface))}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* tape label */
.tape{display:inline-flex;align-items:center;gap:8px;padding:3px 12px 3px 8px;border-radius:3px;
  font-family:var(--f-display);font-size:16px;letter-spacing:.06em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.tape .code{font-family:var(--f-mono);font-weight:600;font-size:13px;padding:0 6px;border-radius:2px;background:rgba(0,0,0,.14)}
.t-black{background:#22262b;color:#f3f4f5}.t-yellow{background:#f3c623;color:#1d1a10}
.t-blue{background:#2f6bd8;color:#fff}.t-green{background:#2f8a4e;color:#fff}
.t-red{background:#d0443a;color:#fff}.t-white{background:#fbfbf8;color:#1d1d1d;box-shadow:inset 0 0 0 1px #c9ccd0}

header.top{display:flex;flex-direction:column;gap:12px}
.room-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;letter-spacing:.02em}
.stats{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;box-shadow:var(--shadow)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:13px 0;font-size:16px;outline:none}

.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted)}
.remind{background:var(--warn-bg);border:0;color:var(--ink)}
.remind b{color:var(--warn)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.cab{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0;transition:transform .12s ease}
.cab:hover{transform:translateY(-2px)}
.cab .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cab .peek{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.cab.add{align-items:center;justify-content:center;border-style:dashed;background:transparent;box-shadow:none;color:var(--muted);min-height:132px;font-size:15px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.link{border:0;background:none;color:var(--accent);padding:4px 0;font-size:14px}

/* cabinet view */
.cabhead{display:flex;flex-direction:column;gap:12px}
.cabhead .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cabhead .tape{font-size:22px;padding:6px 16px 6px 10px}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{margin:6px 0 0;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.08em;font-family:var(--f-mono)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.item .ph{flex:none;width:48px;height:48px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;
  display:grid;place-items:center;color:var(--muted);font-family:var(--f-display);font-size:18px}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column}
.item .name{font-weight:500;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .qty{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:1px}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1px dashed var(--line);border-radius:12px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,15,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;color:var(--ink);min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;background:var(--surface-2);border-radius:8px;padding:8px 10px;color:var(--ink)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:38px;height:28px;border-radius:4px;border:2px solid transparent}
.colors button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.photo-prev{display:flex;gap:10px;align-items:center}
.photo-prev img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.actions .right{display:flex;gap:8px;margin-left:auto}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;
  border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);padding:14px 20px;font-size:15px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){.cab{transition:none}.cab:hover{transform:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<button class="fab" id="fab" type="button">＋ 放東西</button>
<div class="toast" id="toast" hidden></div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
const KEY='alex-room-v1';
const SKINS=[['candy','糖果','#fff3f8','#ff4f9a'],['ocean','海洋','#d9f3fa','#0a9fc0'],['forest','森林','#f1f7e4','#3b9a2c'],['space','太空','#15153a','#ffcd3c'],['plain','簡約','#eceff3','#16695f']];
const TINT={black:'#22262b',yellow:'#f3c623',blue:'#2f6bd8',green:'#2f8a4e',red:'#d0443a',white:'#9aa3ad'};
const ICONS=['📦','👕','👖','🧦','📚','✏️','🎒','🧸','🎮','⚽','🎨','🎻','🛏️','🧴','💊','🔌'];
let skin='candy';try{skin=localStorage.getItem('alex-room-skin')||'candy'}catch(e){}
function applySkin(){if(skin==='plain')document.documentElement.removeAttribute('data-skin');else document.documentElement.setAttribute('data-skin',skin)}
applySkin();
const TAPES=[['black','黑'],['yellow','黃'],['blue','藍'],['green','綠'],['red','紅'],['white','白']];
const app=document.getElementById('app'),overlay=document.getElementById('overlay'),sheet=document.getElementById('sheet');
let view={cab:null,q:''};

function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function sample(){
  const a=uid(),b=uid(),c=uid();
  const soon=new Date(Date.now()+12*864e5).toISOString().slice(0,10);
  return {room:'Alex 的房間',sample:true,history:{},
    cabinets:[{id:a,code:'A',name:'衣櫃',tape:'red',icon:'👕'},{id:b,code:'B',name:'書桌抽屜',tape:'yellow',icon:'✏️'},{id:c,code:'C',name:'床底收納箱',tape:'blue',icon:'📦'}],
    items:[
      {id:uid(),cab:a,name:'冬季外套',spot:'吊衣區',qty:2,exp:'',note:'',photo:''},
      {id:uid(),cab:a,name:'游泳毛巾',spot:'第2層',qty:3,exp:'',note:'',photo:''},
      {id:uid(),cab:b,name:'行動電源',spot:'第1格',qty:1,exp:'',note:'白色那顆比較大',photo:''},
      {id:uid(),cab:b,name:'護照',spot:'第2格',qty:1,exp:'',note:'放在透明夾裡',photo:''},
      {id:uid(),cab:b,name:'AA 電池',spot:'第1格',qty:8,exp:'',note:'',photo:''},
      {id:uid(),cab:c,name:'防曬乳',spot:'',qty:1,exp:soon,note:'',photo:''},
      {id:uid(),cab:c,name:'露營燈',spot:'',qty:1,exp:'',note:'',photo:''}
    ]};
}
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
let state=load()||sample();
if(!state.history)state.history={};
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('存不進去：空間可能滿了，刪掉幾張照片再試');return false}}
function save(){const ok=saveLocal();if(ok){meta.dirty=true;meta.needBackup=true;saveMeta();schedulePush();scheduleBackup()}return ok}

/* ---------- 聯網同步（Google 試算表） ---------- */
const SYNC_URL='https://script.google.com/macros/s/AKfycbzBHMpJu4cC3XOY2POR0_xrtkaJJEebkr0LRVxafdR3P_q-wqaPikrfHTwNCw4sfPqaGw/exec';
const MKEY=KEY+'-sync';
let meta={pw:'',base:0,dirty:false,skip:false};
try{Object.assign(meta,JSON.parse(localStorage.getItem(MKEY)||'{}'))}catch(e){}
function saveMeta(){try{localStorage.setItem(MKEY,JSON.stringify(meta))}catch(e){}}
let syncState={cls:'',txt:'尚未同步'},pushTimer,busy=false,pendingPush=false;
function setSync(cls,txt){syncState={cls,txt};if(cls==='ok'){meta.lastSync=Date.now();saveMeta()}const el=document.getElementById('syncChip');if(el){el.className='sync '+cls;el.querySelector('span:last-child').textContent=txt}}
async function call(body){
  const r=await fetch(SYNC_URL,{method:'POST',body:JSON.stringify(Object.assign({pw:meta.pw},body))});
  return r.json();
}
function adopt(res){
  if(res.data){try{const d=JSON.parse(res.data);if(d&&d.cabinets){state=d;if(!state.history)state.history={};saveLocal()}}catch(e){}}
  meta.base=res.updated||0;meta.dirty=false;saveMeta();
  if(overlay.hidden)render();
}
function handleErr(res){
  if(res&&/密碼/.test(res.error||'')){meta.pw='';saveMeta();setSync('err','密碼錯誤');pwSheet(res.error);return}
  setSync('err',(res&&res.error)||'同步失敗');
}
async function pull(){
  if(!meta.pw||busy)return;
  if(!navigator.onLine){setSync('off','離線中，資料先存在這台');return}
  busy=true;setSync('busy','同步中…');
  try{
    const res=await call({action:'load'});
    if(!res.ok){handleErr(res);return}
    if(!res.data){meta.dirty=true;busy=false;await push();return}
    if(res.updated===meta.base){ if(meta.dirty){busy=false;await push();return} }
    else{ if(meta.dirty)toast('別台裝置有更新，已換成最新資料'); adopt(res) }
    setSync('ok','已同步');
  }catch(e){setSync('off','連不上網路，稍後再同步')}
  finally{busy=false}
}
async function push(){
  if(!meta.pw||meta.skip)return;
  if(busy){pendingPush=true;return}
  if(!navigator.onLine){setSync('off','離線中，連上網會自動上傳');return}
  busy=true;setSync('busy','上傳中…');
  try{
    const res=await call({action:'save',base:meta.base,data:JSON.stringify(state)});
    if(res.ok){meta.base=res.updated;meta.dirty=false;saveMeta();setSync('ok','已同步')}

const IDLE_MS=5*60*1000;let backupTimer;

async function backup(leaving){
  if(!meta.pw||meta.skip||!meta.needBackup)return;
  if(meta.dirty){if(!leaving){await push();if(meta.dirty){scheduleBackup();return}}else return}
  const body=JSON.stringify({pw:meta.pw,action:'backup'});
  if(leaving){try{navigator.sendBeacon(SYNC_URL,new Blob([body],{type:'text/plain'}));meta.needBackup=false;meta.lastBackup=Date.now();saveMeta()}catch(e){}return}
  try{const res=await call({action:'backup'});if(res.ok){meta.needBackup=false;meta.lastBackup=res.time||Date.now();saveMeta()}}catch(e){scheduleBackup()}
}

      <p>刪掉所有櫃子和東西（雲端也會一起清空）。</p>
      <div class="set-row"><button class="btn small danger" id="st-clear" type="button">清空全部</button></div></section>
    <section class="set-sec"><h3>📝 更新日誌</h3><div class="log">${CHANGELOG.map(([v,d,list])=>`<div><b>v${v}</b>　<span class="ver">${d}</span><ul>${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div></section>
    <div class="actions"><span class="right"><button class="btn primary" id="st-close" type="button">完成</button></span></div>`);
  const $=id=>document.getElementById(id);
  $('st-close').onclick=()=>{closeSheet();render()};
  if($('st-sync'))$('st-sync').onclick=()=>{closeSheet();meta.dirty?push():pull()};
  if($('st-cloud'))$('st-cloud').onclick=async()=>{const box=$('st-cloud-list');box.hidden=false;box.className='hint';box.textContent='讀取雲端備份中…';
    try{const res=await call({action:'listBackups'});if(!res.ok){box.textContent=res.error||'讀不到備份';return}
      if(!res.list.length){box.textContent='雲端還沒有備份，改過東西後過 5 分鐘就會有第一份';return}
      box.innerHTML='<div style="display:flex;flex-direction:column;gap:6px">'+res.list.map(b=>`<div class="set-row" style="justify-content:space-between"><span>${esc(fmtTime(b.time))}</span><button class="btn small" data-bk="${esc(b.id)}" type="button">還原這份</button></div>`).join('')+'</div>';
      box.querySelectorAll('[data-bk]').forEach(btn=>armable(btn,'再按一次確認還原',async()=>{btn.textContent='還原中…';
        try{const r2=await call({action:'getBackup',id:btn.dataset.bk});const d=r2.ok&&JSON.parse(r2.data);
          if(!d||!Array.isArray(d.cabinets)){toast('這份備份讀不出來');return}
          state=d;if(!state.history)state.history={};save();closeSheet();view.cab=null;render();toast('已從雲端備份還原')}catch(e){toast('還原失敗，請檢查網路')}}))}
    catch(e){box.textContent='連不上網路'}};
  if($('st-login'))$('st-login').onclick=()=>pwSheet();
  if($('st-logout'))armable($('st-logout'),'再按一次：這台不再同步',()=>{meta.pw='';meta.skip=true;saveMeta();setSync('off','未同步（只存在這台）');settingsSheet();toast('這台裝置已登出同步')});
  sheet.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{skin=b.dataset.skin;try{localStorage.setItem('alex-room-skin',skin)}catch(e){}applySkin();
    sheet.querySelectorAll('[data-skin]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('st-room-save').onclick=()=>{const v=$('st-room').value.trim();if(!v){toast('名稱不能空白');return}state.room=v;save();toast('房間改名為「'+v+'」')};
  $('st-dl').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='Alex房間備份-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('備份檔已下載')};
  $('st-up').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{let d;
    try{d=JSON.parse(rd.result)}catch(err){toast('這不是備份檔');return}
    if(!d||!Array.isArray(d.cabinets)||!Array.isArray(d.items)){toast('這不是 Alex 房間的備份檔');return}
    const h=$('st-up-hint');h.hidden=false;h.innerHTML=`備份裡有 ${d.cabinets.length} 個櫃子、${d.items.length} 種東西，會取代現在的全部資料。　<button class="btn small danger" id="st-up-ok" type="button">確定還原</button>`;
    $('st-up-ok').onclick=()=>{state=d;if(!state.history)state.history={};save();closeSheet();render();toast('已從備份還原')}};rd.readAsText(f)};
  armable($('st-clear'),'再按一次：真的全部清空',()=>{state={room:state.room,cabinets:[],items:[],history:{}};save();closeSheet();view.cab=null;render();toast('房間清空了')});
}
document.getElementById('fab').onclick=()=>itemSheet(null);
render();
if(meta.pw)pull();else if(!meta.skip)pwSheet();else setSync('off','未同步（只存在這台）');
})();
</script>

</body>
</html>
